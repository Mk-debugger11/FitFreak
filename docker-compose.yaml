networks:
  fitfreak_network:
    external: true
services:
  nginx:
    image: nginx:latest
    container_name: ftfrk_nginx
    restart: unless-stopped
    ports:
     - 80:80
     - 443:443
    volumes:
     - /home/ubuntu/FitFreak/nginx/express.conf:/etc/nginx/conf.d/default.conf
     - /etc/letsencrypt:/etc/letsencrypt
    networks:
     - fitfreak_network
    depends_on:
     - express
  express:
    build: ./backend
    container_name: ftfrk_express
    env_file: ./backend/.env
    networks:
     - fitfreak_network

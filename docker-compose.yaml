networks:
  fitfreak_network:
    external: true
services:
  nginx:
    image: nginx:latest
    container_name: ftfrk_nginx
    restart: unless-stopped
    ports:
     - 80:80
     - 443:443
    volumes:
     - /home/ubuntu/FitFreak/nginx/express.conf:/etc/nginx/conf.d/default.conf
     - /etc/letsencrypt:/etc/letsencrypt
    networks:
     - fitfreak_network
    depends_on:
     - express
  database:
    image: mongo:latest
    contianer_name: ftfrk_mongo
    restart: always
    networks: 
      fitfreak_network
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    
  express:
    build: ./backend
    container_name: ftfrk_express
    env_file: ./backend/.env
    networks:
     - fitfreak_network
    depends_on: 
     - database

networks:
  fitfreak_network:
    external: true

volumes:
  ftfrk_data:
    external: true

services:
  nginx:
    image: nginx:latest
    container_name: ftfrk_nginx
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/express.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - fitfreak_network
    depends_on:
      - express

  database:
    image: mongo:7.0
    container_name: ftfrk_mongo
    restart: always
    networks:
      - fitfreak_network
    env_file: ./backend/.env
    volumes:
      - ftfrk_data:/data/db

  express:
    image: ghcr.io/mk-debugger11/fitfreak:${IMAGE_TAG:-latest}
    container_name: ftfrk_express
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - ./backend/backups:/backend/backups
    networks:
      - fitfreak_network
    depends_on:
      - database

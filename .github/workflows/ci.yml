name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker-compose.yaml"
      - "nginx/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Run backend tests
        run: |
          cd backend
          npm test

      - name: Validate docker-compose.yaml
        run: |
          cp backend/.env.example backend/.env
          docker compose config -q
          rm -f backend/.env

  build-and-push-image:
    needs:
      - test-backend
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push linux/arm64 image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/mk-debugger11/fitfreak:${{ github.sha }}
            ghcr.io/mk-debugger11/fitfreak:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs:
      - build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH deploy key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy and seed on Oracle VPS
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "IMAGE_TAG='${IMAGE_TAG}' bash -s" <<'EOF'
          set -euo pipefail
          cd /home/ubuntu/FitFreak

          git fetch origin main
          git reset --hard origin/main

          mkdir -p backend/backups

          export IMAGE_TAG
          docker compose pull express
          docker compose up -d --remove-orphans

          # Wait for Express container to respond on port 3000
          for i in $(seq 1 30); do
            if docker compose exec -T express node -e "fetch('http://127.0.0.1:3000/api/workouts', { signal: AbortSignal.timeout(5000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Express failed readiness check"
              docker compose logs --tail=50 express
              exit 1
            fi
            sleep 2
          done

          # Validate and reload nginx config
          docker compose exec -T nginx nginx -t
          docker compose exec -T nginx nginx -s reload

          # Run idempotent exercise catalog seed/migration when present
          if docker compose exec -T express test -f /backend/seedExercises.js; then
            echo "Running node seedExercises.js inside ftfrk_express..."
            docker compose exec -T express node seedExercises.js
          else
            echo "seedExercises.js not present in image; skipping seed."
          fi

          # Run idempotent food catalog seed/migration when present
          if docker compose exec -T express test -f /backend/seedFoods.js; then
            echo "Running node seedFoods.js inside ftfrk_express..."
            docker compose exec -T express node seedFoods.js
          else
            echo "seedFoods.js not present in image; skipping food seed."
          fi

          # Verify external HTTPS endpoint end-to-end
          curl -fsS -o /dev/null https://mukulkr.space/api/workouts
          echo "Deploy verified: https://mukulkr.space/api/workouts returned 200"

          docker image prune -f
          EOF

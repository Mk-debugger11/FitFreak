name: Test Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker-compose.yaml"

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: install dependencies
        run: |
          cd backend
          npm ci

      - name: run tests
        run: |
          cd backend
          npm test

  build-and-push-image:
    needs:
      - test-backend
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set up qemu
        uses: docker/setup-qemu-action@v3

      - name: creating multiarch builder
        run: docker buildx create --name multiarch --driver docker-container --bootstrap

      - name: using mulitarch builder as default
        run: docker buildx use multiarch

      - name: checkout repo
        uses: actions/checkout@v4

      - name: build image
        run: docker buildx build --platform linux/arm64 -t ghcr.io/mk-debugger11/fitfreak:${{ github.sha }} -t ghcr.io/mk-debugger11/fitfreak:latest ./backend --push
